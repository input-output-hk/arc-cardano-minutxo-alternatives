<svg xmlns="http://www.w3.org/2000/svg" width="960" height="310" viewBox="0 0 960 310" role="img" aria-labelledby="title desc">
  <title id="title">Recovering Bob’s and Carol’s input reserves</title>
  <desc id="desc">Transaction tx creates two outputs at slot 100. In the live UTxO map each input reference resolves to the recorded output and AtSlot 100. When either input is spent, computeDeposit selects the pricing rules in force at slot 100. Bob’s minimum-ADA output credits 1.6 ADA already in its 5 ADA value. Carol’s deposit-backed output carries one token B and zero application ADA. It credits a separate 2 ADA deposit.</desc>
  <style>
    text { font-family: Barlow, "Helvetica Neue", Arial, sans-serif; fill: #20303b; }
    .head { font-size: 18px; font-weight: 600; }
    .name { font-size: 21px; font-weight: 600; }
    .detail { font-size: 18px; }
    .meta { font-size: 16px; fill: #526774; }
    .type { font-family: "SFMono-Regular", Consolas, monospace; font-size: 16px; }
    .amount { font-size: 23px; font-weight: 600; }
    .arrow { fill: none; stroke: #748995; stroke-width: 1.75; }
  </style>
  <rect width="960" height="310" fill="#fff"/>
  <text x="11" y="28" class="head">Spending input</text>
  <text x="173" y="28" class="head">Entry in the live UTxO set</text>
  <text x="173" y="53" class="meta">Unspent (TxOut era)</text>
  <text x="616" y="28" class="head">Reserve credited on spend</text>
  <text x="616" y="53" class="meta">Pricing rules in force at slot 100</text>

  <g transform="translate(0 69)">
    <text x="11" y="61" class="type">tx#0</text>
    <path d="M79 55h76m-7-5 7 5-7 5" class="arrow"/>
    <rect x="173" y="1" width="380" height="108" rx="5" fill="#fff" stroke="#bccbd3"/>
    <text x="192" y="31" class="name">Bob · Minimum-ADA output</text>
    <text x="192" y="58" class="detail">Value · 5 ADA</text>
    <path d="M174 70h378" stroke="#dce3e8"/>
    <text x="192" y="95" class="type">allocatedAt = AtSlot 100</text>
    <path d="M554 55h44m-7-5 7 5-7 5" class="arrow"/>
    <rect x="616" y="1" width="335" height="108" rx="5" fill="#f0f4f6" stroke="#c5d1d7"/>
    <text x="636" y="47" class="amount">1.6 ADA</text>
    <text x="636" y="76" class="detail">Included in Bob’s 5 ADA</text>
  </g>

  <g transform="translate(0 193)">
    <text x="11" y="61" class="type">tx#1</text>
    <path d="M79 55h76m-7-5 7 5-7 5" class="arrow"/>
    <rect x="173" y="1" width="380" height="108" rx="5" fill="#fff" stroke="#bccbd3"/>
    <text x="192" y="31" class="name">Carol · Deposit-backed output</text>
    <text x="192" y="58" class="detail">Value · 1 token B and 0 ADA</text>
    <path d="M174 70h378" stroke="#dce3e8"/>
    <text x="192" y="95" class="type">allocatedAt = AtSlot 100</text>
    <path d="M554 55h44m-7-5 7 5-7 5" class="arrow"/>
    <rect x="616" y="1" width="335" height="108" rx="5" fill="#fbf0ee" stroke="#e8cbc7"/>
    <text x="636" y="47" class="amount" style="fill:#99372f">2 ADA</text>
    <text x="636" y="76" class="detail">Held as an external deposit</text>
  </g>
</svg>
