  <circle class="start" cx="135" cy="291.3" r="5" stroke="#2647a5"/>
  <text class="value" x="151" y="284" fill="#2647a5">56.3B now</text>
  <text class="value" x="1078" y="97" text-anchor="end" fill="#2647a5">65.3B maximum-supply limit</text>
  </g>

  <text class="panel" x="92" y="370">RESERVE REMAINING</text>
  <text class="formula" x="1090" y="370" text-anchor="end">R(n) = R₀(1 − ρ)ⁿ</text>
