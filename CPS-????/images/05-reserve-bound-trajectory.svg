<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Reserve depletion and the theoretical issued-supply UTxO ceiling</title>
  <desc id="desc">Two aligned plots share a thirty-year time axis. The upper plot shows the theoretical UTxO-count ceiling rising from 56.3 to 65.2 billion. The lower plot shows the reserve declining from 6.206 billion ada toward zero under maximum monetary expansion of 0.3 percent per epoch. This is an analytical envelope, not a forecast.</desc>
  <defs>
    <style>
      .bg{fill:#fff}.rule{stroke:#d9ddd9;stroke-width:1}.axis{stroke:#8b938f;stroke-width:1}.projection{stroke:#b9bfbb;stroke-width:1;stroke-dasharray:3 5}.ceiling{fill:none;stroke:#2647a5;stroke-width:3}.reserve{fill:none;stroke:#a66200;stroke-width:3}.area{fill:#2647a5;opacity:.055}.start{fill:#fff;stroke-width:2.5}.ink{fill:#18201c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.muted{fill:#66706b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.panel{fill:#3f4944;font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.06em}.tick{fill:#6d7671;font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.value{font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.formula{fill:#66706b;font:14px ui-monospace,SFMono-Regular,Menlo,monospace}.foot{fill:#737c77;font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    </style>
  </defs>
  <rect class="bg" width="1200" height="660"/>

  <text class="ink" x="92" y="42" font-size="22" font-weight="500">Reserve depletion expands the issued-supply ceiling</text>
  <text class="muted" x="92" y="70" font-size="14">Analytical envelope from epoch 647 · ρ = 0.003 per five-day epoch · fixed 160-byte denominator</text>

  <text class="panel" x="92" y="102">THEORETICAL UTxO CEILING</text>
  <text class="formula" x="1090" y="102" text-anchor="end">N(n) = [Smax − R₀(1 − ρ)ⁿ] / ph</text>

