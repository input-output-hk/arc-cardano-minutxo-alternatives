<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Variant B: the deposit is an obligation on the funder's account</title>
  <desc id="desc">A transaction that occupies UTxO space raises a minimum-balance floor on an account the funder chooses. Freeing the space lowers the floor. The ada never leaves the funder's account.</desc>
  <defs>
    <style>
      .bg{fill:#fbfcfa}.panel{fill:#fff;stroke:#c9cec6;stroke-width:2}.grow{fill:#f6f2ea;stroke:#8f6410;stroke-width:2}.shrink{fill:#e2e7f6;stroke:#23439e;stroke-width:2}.reserve{fill:#fff;stroke:#12171a;stroke-width:3}.ink{fill:#12171a;font:600 22px system-ui,sans-serif}.body{fill:#5a6560;font:18px system-ui,sans-serif}.mono{fill:#23439e;font:600 18px ui-monospace,monospace}.label{fill:#8b948e;font:600 15px ui-monospace,monospace;letter-spacing:1px}.ochre{fill:#8f6410}.blue{fill:#23439e}.rule{stroke:#5a6560;stroke-width:2;fill:none}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#5a6560"/></marker>
  </defs>
  <rect class="bg" width="1200" height="560" rx="8"/>

  <text class="label" x="48" y="48">TX 1 · OCCUPIES UTXO SPACE</text>
  <rect class="grow" x="48" y="76" width="340" height="168" rx="8"/>
  <text class="ink" x="78" y="116">Creates an output</text>
  <text class="mono ochre" x="78" y="151">&#10216;10 X, 0 ada&#10217;</text>
  <text class="body" x="78" y="188">space requirement M = 1 ADA</text>
  <text class="mono ochre" x="78" y="220">utxo-mu = +1 ADA</text>

  <line class="rule" x1="410" y1="160" x2="476" y2="160" marker-end="url(#arrow)"/>

  <rect class="panel" x="498" y="100" width="342" height="140" rx="8"/>
  <text class="ink" x="526" y="136">Raises Alice&#8217;s floor 0 &#8594; 1</text>
  <text class="mono" x="526" y="172">utxo-mu&#8242; &#8805; mu + utxo-mu</text>
  <text class="mono ochre" x="526" y="204">1 &#8805; 0 + 1 &#10003;</text>

  <line class="rule" x1="862" y1="160" x2="920" y2="160" marker-end="url(#arrow)"/>

  <rect class="reserve" x="942" y="76" width="210" height="172" rx="8"/>
  <text class="label" x="962" y="110">ALICE&#8217;S ACCOUNT</text>
  <rect class="grow" x="962" y="128" width="42" height="30"/>
  <rect class="panel" x="1004" y="128" width="128" height="30"/>
  <text class="mono ochre" x="962" y="196">1 ADA frozen</text>
  <text class="body" x="962" y="226">3 ADA spendable</text>

  <text class="label" x="48" y="304">TX 2 · FREES THE SPACE</text>
  <rect class="shrink" x="48" y="332" width="340" height="168" rx="8"/>
  <text class="ink" x="78" y="372">Consumes that output</text>
  <text class="mono blue" x="78" y="407">&#10216;10 X, 0 ada&#10217;</text>
  <text class="body" x="78" y="444">space freed M = 1 ADA</text>
  <text class="mono blue" x="78" y="476">utxo-mu = &#8722;1 ADA</text>

  <line class="rule" x1="410" y1="416" x2="476" y2="416" marker-end="url(#arrow)"/>

  <rect class="panel" x="498" y="356" width="342" height="140" rx="8"/>
  <text class="ink" x="526" y="392">Lowers Alice&#8217;s floor 1 &#8594; 0</text>
  <text class="mono" x="526" y="428">utxo-mu&#8242; &#8805; mu + utxo-mu</text>
  <text class="mono blue" x="526" y="460">0 &#8805; 1 + (&#8722;1) &#10003;</text>

  <line class="rule" x1="862" y1="416" x2="920" y2="416" marker-end="url(#arrow)"/>

  <rect class="reserve" x="942" y="332" width="210" height="172" rx="8"/>
  <text class="label" x="962" y="366">ALICE&#8217;S ACCOUNT</text>
  <rect class="panel" x="962" y="384" width="170" height="30"/>
  <text class="mono blue" x="962" y="452">0 ADA frozen</text>
  <text class="body" x="962" y="482">4 ADA spendable</text>

  <text class="body" x="48" y="528">The deposit is an inclusive lower bound &#8212; a CIP-0159 account interval &#8212; on an account the funder chooses:</text>
  <text class="body" x="48" y="552">frozen while the space is occupied, thawed when it is freed. The ada never moves; the funder keeps the claim.</text>
</svg>
