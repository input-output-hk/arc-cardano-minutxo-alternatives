<svg xmlns="http://www.w3.org/2000/svg" width="960" height="454" viewBox="0 0 960 454" role="img" aria-labelledby="title desc">
  <title id="title">From a reserve policy to a prepared transaction body</title>
  <desc id="desc">The builder calls applyDepositPolicy with a draft, a policy and the ledger context. The policy offers reserveTxId output 0 for top-ups and a new refund output. The function returns a prepared TxBody for the builder to balance and sign. Two alternative drafts illustrate the result. An allocation adds the offered TxIn to ordinary inputs and declares Allocate 0.4 ADA. A release appends the supplied refund output at index 1 and declares Release 1.6 ADA to that index. The funding candidate stays unspent on release.</desc>
  <style>
    text { font-family: Barlow, "Helvetica Neue", Arial, sans-serif; fill: #20303b; }
    .label { font-size: 17px; fill: #526774; }
    .body { font-size: 19px; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 19px; }
    .result { font-size: 24px; font-weight: 600; }
    .line { fill: none; stroke: #8b9ca6; stroke-width: 1.7; }
    .rule { stroke: #c9d3d9; }
  </style>
  <rect width="960" height="454" fill="#fff"/>

  <rect x="10" y="8" width="940" height="85" rx="6" fill="#f3f6f7" stroke="#c9d3d9"/>
  <path class="rule" d="M262 23v54m421-54v54"/>
  <text x="27" y="36" class="label">Draft</text>
  <text x="27" y="68" class="body">1 application output</text>
  <text x="279" y="36" class="label">Reserve policy</text>
  <text x="279" y="61" class="body">Top-up from reserveTxId#0</text>
  <text x="279" y="82" class="body">Refund to a new refundTxOut</text>
  <text x="701" y="36" class="label">Ledger context</text>
  <text x="701" y="68" class="body">UTxO entries and pricing</text>

  <path class="line" d="M480 93v20"/>
  <rect x="175" y="113" width="610" height="49" rx="6" fill="#263e4d"/>
  <text x="480" y="144" text-anchor="middle" class="mono" style="fill:#fff">applyDepositPolicy(draft, policy, ledgerContext)</text>

  <path class="line" d="M480 162v39M240 217v-14q0-2 2-2h476q2 0 2 2v14"/>
  <rect x="309" y="185" width="342" height="32" fill="#fff"/>
  <text x="480" y="207" text-anchor="middle" class="body">Prepared TxBody · before signing</text>
  <path d="m235 213 5 8 5-8m470 0 5 8 5-8" fill="#8b9ca6"/>

  <g transform="translate(10,225)">
    <rect width="459" height="217" rx="6" fill="#fff" stroke="#c9d3d9"/>
    <text x="19" y="34" class="result">If the draft needs a top-up</text>
    <text x="19" y="70" class="label">Add to ordinary spending inputs</text>
    <text x="19" y="97" class="mono">TxIn reserveTxId 0</text>
    <text x="19" y="123" class="label">Output 0 of the transaction that created it</text>
    <path class="rule" d="M19 143h421"/>
    <text x="19" y="170" class="label">Deposit declaration · field 28</text>
    <text x="19" y="200" class="result">Allocate 0.4 ADA</text>
  </g>

  <g transform="translate(491,225)">
    <rect width="459" height="217" rx="6" fill="#fff" stroke="#c9d3d9"/>
    <text x="19" y="34" class="result">If the draft releases ADA</text>
    <text x="19" y="70" class="label">Append the refund to ordinary outputs</text>
    <text x="19" y="97" class="mono">outputs[1] = refundTxOut</text>
    <text x="19" y="123" class="label">The reserve input stays unspent.</text>
    <path class="rule" d="M19 143h421"/>
    <text x="19" y="170" class="label">Deposit declaration · field 28</text>
    <text x="19" y="200" class="result">Release 1.6 ADA to output <tspan fill="#a4352d">1</tspan></text>
  </g>
</svg>
